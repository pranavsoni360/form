# QA environment: finix.vgipl.com:8445 -> QA backend :8300 + shared frontend :3001
server {
    listen 8445 ssl;
    listen [::]:8445 ssl;
    server_name finix.vgipl.com;
    ssl_certificate     /etc/letsencrypt/live/finix.vgipl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finix.vgipl.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 25m;

    # ── LOS-SEC-BLOCK ──────────────────────────────────────────────────
    # These routes have no application-level auth. Their only legitimate
    # callers are the voice agents / internal jobs on 127.0.0.1, which talk
    # to the backend directly and never traverse nginx. Blocking them at the
    # edge closes public abuse (mass WhatsApp sends, forged transcripts and
    # guarantor consent) without affecting any real caller.
    # NOTE: exact-match (=) wins over the /api/ prefix below.
    location = /api/agent/transcript         { return 403; }
    location = /api/agent/send-whatsapp-form { return 403; }
    location = /api/agent/schedule-callback  { return 403; }
    location = /api/guarantor/transcript     { return 403; }
    location = /api/guarantor/consent        { return 403; }
    location = /api/send-campaign            { return 403; }
    location = /api/send-campaign-bulk       { return 403; }
    location = /api/ops/errors/cleanup       { return 403; }
    # ── end LOS-SEC-BLOCK ──────────────────────────────────────────────

    location /api/ {
        proxy_pass https://127.0.0.1:8300;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass https://127.0.0.1:3002;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
