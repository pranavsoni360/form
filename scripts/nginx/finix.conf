# finix.vgipl.com — LOS form app, served same-origin via nginx.
#   nginx terminates TLS (finix cert), proxies:
#     /api/ → FastAPI backend on 127.0.0.1:8200 (HTTPS internally, own cert)
#     /     → Next.js frontend on 127.0.0.1:3001 (HTTPS internally, own cert)
# Install to /etc/nginx/conf.d/finix.conf, then: nginx -t && systemctl reload nginx
# virtualvaani.vgipl.com is untouched (keeps its direct :3001/:8200 access).

server {
    listen 80;
    listen [::]:80;
    server_name finix.vgipl.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name finix.vgipl.com;

    ssl_certificate     /etc/letsencrypt/live/finix.vgipl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finix.vgipl.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;   # document/file uploads

    # Backend API (FastAPI :8200, HTTPS internally)
    location /api/ {
        proxy_pass https://127.0.0.1:8200;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # SSE / streaming endpoints
        proxy_read_timeout 3600s;
    }

    # Frontend (Next.js :3001, HTTPS internally)
    location / {
        proxy_pass https://127.0.0.1:3001;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
